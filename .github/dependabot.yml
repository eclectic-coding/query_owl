version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    # Include transitive gems (loofah, nokogiri, rack, ...) so advisories
    # in indirect dependencies get a PR before the weekly audit trips.
    allow:
      - dependency-type: all
    groups:
      bundler-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
